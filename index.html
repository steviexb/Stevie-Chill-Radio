<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stevie's Chill Radio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="ambient-glow"></div>

    <header class="station-header">

        <div class="station-status">
            <span class="live-dot"></span>
            LIVE
        </div>

        <h1>Stevie's Chill Radio</h1>

        <p class="tagline">
            Work, Game, or Think to Some Chill Tunes
        </p>

    </header>


    <main class="radio-shell">

        <div class="console-top">

            <span class="broadcast-label">
                STEVIE'S PERSONAL BROADCAST
            </span>

            <span id="station-clock">
                --:--
            </span>

        </div>


        <section class="radio-grid">

            <!-- VIDEO SIDE -->

            <div class="video-side">

                <div class="screen-frame">

                    <div id="player"></div>

                </div>

            </div>


            <!-- NOW PLAYING SIDE -->

            <div class="now-playing-panel">

                <p class="eyebrow">
                    NOW PLAYING
                </p>

                <h2 id="track-title">
                    Tuning in...
                </h2>

                <p id="track-artist">
                    Stevie's Chill Radio
                </p>


                <div class="equalizer" id="equalizer">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="controls">

                    <button id="previous-button">
                        ◀ PREVIOUS
                    </button>

                    <button id="next-button">
                        NEXT ▶
                    </button>

                </div>

            </div>

        </section>


        <section class="lower-console">

            <div class="station-message">

                <p class="eyebrow">
                    STEVIE'S NOTE
                </p>

                <p class="message-text">
                    Lock in. Or don't. It's chill.
                </p>

            </div>


            <div class="signal">

                <span class="signal-dot"></span>

                SIGNAL ONLINE

            </div>

        </section>

    </main>


    <footer>

        <p>
            STEVIE'S CHILL RADIO
            <span>•</span>
            EST. 2026
        </p>

    </footer>


    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>

</body>

</html>
